ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU is currently not streamed by the ESP32 firmware. To enable
    # fusion, publish sensor_msgs/Imu on /imu_data, then uncomment:
    #
    #   imu0: /imu_data
    #   imu0_config: [false, false, false,
    #                 false, false, true,        # yaw from fused orientation
    #                 false, false, false,
    #                 false, false, false,
    #                 false, false, false]
    #   imu0_differential: false
    #   imu0_relative: false
    #   imu0_remove_gravitational_acceleration: true
