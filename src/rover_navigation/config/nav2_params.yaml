amcl:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    use_sim_time: false
    laser_min_range: 0.12
    laser_max_range: 8.0
    min_particles: 500
    max_particles: 3000
    kld_err: 0.05
    kld_z: 0.99
    update_min_d: 0.10
    update_min_a: 0.10
    respawn_interval: 1.0
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    sigma_x: 0.05
    sigma_y: 0.05
    sigma_a: 0.05
    laser_z_short: 0.05
    laser_model_type: "likelihood_field"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"
    default_bt_xml_filename: "nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - "nav2_compute_path_to_pose_action_bt_node"
      - "nav2_follow_path_action_bt_node"
      - "nav2_spin_action_bt_node"
      - "nav2_wait_action_bt_node"
      - "nav2_clear_costmap_service_bt_node"
      - "nav2_is_stuck_condition_bt_node"
      - "nav2_goal_reached_condition_bt_node"
      - "nav2_initial_pose_received_condition_bt_node"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::ProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::GoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.10
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_vel_x: 0.30
      min_vel_x: -0.10
      max_vel_theta: 1.5
      min_vel_theta: -1.5
      vx_samples: 20
      vtheta_samples: 40
      sim_period: 0.05
      debug_trajectory_details: false
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalDist", "PathAlign", "PathDist", "Twirling"]
      Oscillation:
        plugin: "dwb_critics::Oscillation"
      ObstacleFootprint:
        plugin: "dwb_critics::ObstacleFootprint"
        scale: 0.5
      GoalDist:
        plugin: "dwb_critics::GoalDist"
        scale: 3.0
      PathAlign:
        plugin: "dwb_critics::PathAlign"
        scale: 0.5
      PathDist:
        plugin: "dwb_critics::PathDist"
        scale: 0.5
      Twirling:
        plugin: "dwb_critics::Twirling"
        scale: 2.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
      spin_dist: 1.57
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.15
      backup_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_time: 5.0
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
      scale_x: 0.5
      scale_theta: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: "map"
      robot_base_frame: "base_link"
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: [[0.15, 0.11], [0.15, -0.11], [-0.15, -0.11], [-0.15, 0.11]]
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
        enabled: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: ["laser_scan_sensor"]
        laser_scan_sensor:
          topic: "/scan"
          sensor_frame: "lidar_link"
          data_type: "LaserScan"
          raytrace_range: 3.0
          obstacle_range: 3.0
          expected_update_rate: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: "odom"
      robot_base_frame: "base_link"
      update_frequency: 5.0
      publish_frequency: 5.0
      resolution: 0.05
      width: 3
      height: 3
      rolling_window: true
      track_unknown_space: true
      footprint: [[0.15, 0.11], [0.15, -0.11], [-0.15, -0.11], [-0.15, 0.11]]
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: ["laser_scan_sensor"]
        laser_scan_sensor:
          topic: "/scan"
          sensor_frame: "lidar_link"
          data_type: "LaserScan"
          raytrace_range: 3.0
          obstacle_range: 3.0
          expected_update_rate: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.20

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    max_velocity: [0.30, 0.0, 1.5]
    min_velocity: [-0.10, 0.0, -1.5]
    max_acceleration: [0.50, 0.0, 3.0]
    max_deceleration: [1.0, 0.0, 3.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    cmd_vel_topic: "cmd_vel_nav"
    # The smoother publishes here so the soft e-stop node can intercept.
    # The e-stop republishes (or zeros) on /cmd_vel for the ESP32 bridge.
    smoothed_cmd_vel_topic: "cmd_vel_in"
